services:
  bot:
    # Собираем образ из Dockerfile в текущем каталоге
    build: .
    # Передаём переменные окружения из локального файла .env в контейнер
    env_file:
      - .env
    # Подключаем логи к /app/logs внутри контейнера
    volumes:
      - ./logs:/app/logs
    # Автоматический перезапуск контейнера
    restart: unless-stopped